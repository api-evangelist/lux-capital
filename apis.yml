aid: lux-capital
name: Lux Capital
description: >-
  Lux Capital is a New York City-based venture capital firm founded in 2000 by
  Josh Wolfe, Peter Hebert, and Robert Paull that backs entrepreneurs building
  companies at the frontier of science and technology, turning "sci-fi into
  sci-fact." The firm systematically mines academia and government research labs
  for breakthrough technologies that have matured beyond proof-of-concept but
  have not yet attracted mainstream venture attention, then makes long-term bets
  on contrarians and outsiders challenging the status quo. Lux invests primarily
  at early stage across three focus areas: AI and technology, defense/space/
  manufacturing, and biotech/healthcare, with an emphasis on deep tech, robotics,
  and emerging science. The firm manages roughly $7 billion in assets under
  management across nine core funds, closing Lux Ventures IX at $1.5 billion in
  January 2026, and has invested in over 200 companies. Through Lux Labs, launched
  in 2024, the firm has also helped create more than 20 new companies. Notable
  portfolio companies include Anduril, Applied Intuition, Databricks, Cognition,
  Ramp, Runway, Recursion Pharmaceuticals, Planet, and Saildrone. Lux is
  headquartered in New York City with an additional office in Silicon Valley.
